# Profile for running from an IDE / host JVM against containers exposed on localhost.
# Activate with SPRING_PROFILES_ACTIVE=local. Environment variables still win.
spring:
  datasource:
    url: ${DB_POOLED_URL:${DB_URL:jdbc:postgresql://localhost:5432/faultlab}}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
  flyway:
    url: ${DB_DIRECT_URL:${DB_URL:jdbc:postgresql://localhost:5432/faultlab}}

faultlab:
  inventory:
    base-url: ${INVENTORY_BASE_URL:http://localhost:8081}
  resilience:
    retry:
      mode: ${RETRY_MODE:MANUAL}
      max-attempts: ${RETRY_MAX_ATTEMPTS:3}
      backoff-strategy: ${RETRY_BACKOFF_STRATEGY:LINEAR}
      initial-interval: ${RETRY_INITIAL_INTERVAL:200ms}
    circuit-breaker:
      wait-duration-in-open-state: ${CB_WAIT_OPEN:5s}
  reconciler:
    interval-ms: ${RECONCILER_INTERVAL_MS:10000}
