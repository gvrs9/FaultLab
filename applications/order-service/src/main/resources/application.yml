# Every value can be overridden by an environment variable (shown in ${...}).
spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

  datasource:
    url: ${DB_POOLED_URL:${DB_URL:jdbc:postgresql://postgres:5432/faultlab}}
    username: ${DB_USERNAME:faultlab}
    password: ${DB_PASSWORD:faultlab}
    hikari:
      pool-name: order-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:2000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1200000}
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:0}
      data-source-properties:
        ApplicationName: order-service
        socketTimeout: ${DB_SOCKET_TIMEOUT_S:30}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: ${DB_DIRECT_URL:${DB_URL:jdbc:postgresql://postgres:5432/faultlab}}
    user: ${DB_USERNAME:faultlab}
    password: ${DB_PASSWORD:faultlab}
    schemas: order_service
    default-schema: order_service
    create-schemas: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        faultlab.db.operation: true
        hikaricp.connections.acquire: true
        hikaricp.connections.usage: true
      maximum-expected-value:
        http.server.requests: 30s
        http.client.requests: 30s
        faultlab.db.operation: 30s

faultlab:
  db:
    artificial-delay: ${DB_ARTIFICIAL_DELAY:0ms}

  inventory:
    base-url: ${INVENTORY_BASE_URL:http://inventory-service:8081}
    connect-timeout: ${HTTP_CONNECT_TIMEOUT:500ms}
    response-timeout: ${HTTP_RESPONSE_TIMEOUT:2s}

  resilience:
    retry:
      enabled: ${RETRY_ENABLED:true}
      mode: ${RETRY_MODE:RESILIENCE4J}                      # NONE | MANUAL | RESILIENCE4J
      max-attempts: ${RETRY_MAX_ATTEMPTS:3}                 # total attempts incl. the first
      retryable-status-codes: ${RETRY_STATUS_CODES:502,503,504}
      # Matched against the exception and its causes (class or subclass). Never "retry everything".
      retryable-exceptions: ${RETRY_EXCEPTIONS:java.net.ConnectException,java.net.http.HttpTimeoutException,java.net.SocketTimeoutException}
      backoff-strategy: ${RETRY_BACKOFF_STRATEGY:EXPONENTIAL}   # FIXED | LINEAR | EXPONENTIAL
      initial-interval: ${RETRY_INITIAL_INTERVAL:100ms}
      multiplier: ${RETRY_MULTIPLIER:2.0}
      max-interval: ${RETRY_MAX_INTERVAL:2s}
      jitter: ${RETRY_JITTER:FULL}                          # NONE | FULL | EQUAL
    circuit-breaker:
      enabled: ${CB_ENABLED:true}
      failure-rate-threshold: ${CB_FAILURE_RATE_THRESHOLD:50}
      slow-call-rate-threshold: ${CB_SLOW_CALL_RATE_THRESHOLD:80}
      slow-call-duration: ${CB_SLOW_CALL_DURATION:1500ms}
      sliding-window-type: ${CB_SLIDING_WINDOW_TYPE:COUNT_BASED}   # COUNT_BASED | TIME_BASED
      sliding-window-size: ${CB_SLIDING_WINDOW_SIZE:20}
      minimum-number-of-calls: ${CB_MINIMUM_CALLS:10}
      wait-duration-in-open-state: ${CB_WAIT_OPEN:10s}
      permitted-calls-in-half-open-state: ${CB_HALF_OPEN_CALLS:5}
      max-wait-in-half-open-state: ${CB_MAX_WAIT_HALF_OPEN:0s}
    bulkhead:
      enabled: ${BULKHEAD_ENABLED:true}
      max-concurrent-calls: ${BULKHEAD_MAX_CONCURRENT:50}
      max-wait-duration: ${BULKHEAD_MAX_WAIT:0ms}

  reconciler:
    enabled: ${RECONCILER_ENABLED:true}
    interval-ms: ${RECONCILER_INTERVAL_MS:30000}
    min-age: ${RECONCILER_MIN_AGE:30s}
    batch-size: ${RECONCILER_BATCH_SIZE:50}
