# Observability stack. Core: Prometheus, Grafana, Tempo, OpenTelemetry Collector.
# Logging (optional): docker compose --profile logging up -d   -> Elasticsearch + Logstash
name: faultlab-observability

x-common: &common
  restart: unless-stopped
  stop_grace_period: 20s
  networks: [faultlab-net]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  otel-collector:
    <<: *common
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.130.0}
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4317:4317", "4318:4318", "13133:13133"]
    depends_on: [tempo]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }

  tempo:
    <<: *common
    image: ${TEMPO_IMAGE:-grafana/tempo:2.8.1}
    user: "0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - faultlab-tempo:/var/tempo
    ports: ["3200:3200"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  prometheus:
    <<: *common
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - faultlab-prometheus:/prometheus
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  grafana:
    <<: *common
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.0}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - faultlab-grafana:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on:
      prometheus: { condition: service_healthy }
      tempo: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }

  elasticsearch:
    <<: *common
    profiles: ["logging"]
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.17.0}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      cluster.routing.allocation.disk.threshold_enabled: "false"
    volumes:
      - faultlab-elasticsearch:/usr/share/elasticsearch/data
    ports: ["9200:9200"]
    ulimits:
      memlock: { soft: -1, hard: -1 }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1536M }

  logstash:
    <<: *common
    profiles: ["logging"]
    image: ${LOGSTASH_IMAGE:-docker.elastic.co/logstash/logstash:8.17.0}
    environment:
      LS_JAVA_OPTS: ${LS_JAVA_OPTS:--Xms256m -Xmx256m}
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports: ["5000:5000"]
    depends_on:
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9600/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 768M }

networks:
  faultlab-net:
    external: true
    name: faultlab-net

volumes:
  faultlab-tempo:
  faultlab-prometheus:
  faultlab-grafana:
  faultlab-elasticsearch:
