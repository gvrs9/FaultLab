# Log4j2 JsonTemplateLayout -> TCP (newline-delimited JSON) -> Elasticsearch
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  date {
    match => ["@timestamp", "ISO8601"]
  }
  mutate {
    remove_field => ["host", "port", "event"]
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    index => "faultlab-logs-%{+YYYY.MM.dd}"
    manage_template => false
  }
}
